<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f3eddf" />
  <title>糖画铺，把童年画成甜的</title>
  <meta name="description" content="一勺热糖，几笔流转。在三维糖画铺里看铜勺浇糖，或亲手画一幅属于自己的糖画。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23a33927'/%3E%3Ctext x='32' y='46' font-size='43' text-anchor='middle' fill='%23fff1d5'%3E糖%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/"}}</script>
</head>
<body>
<div class="app-shell">
  <header class="masthead">
    <a class="brand" href="./" aria-label="糖画铺首页"><span class="seal">糖</span><span>糖画铺<small>留一口，小时候的甜。</small></span></a>
    <p class="mast-note">以糖为墨，以勺为笔</p>
    <button class="text-button" id="save"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 15v5h14v-5"/></svg>收藏这份甜</button>
  </header>

  <main class="workbench">
    <aside class="studio-panel" aria-label="糖画工具">
      <div class="introduction"><h1>把童年，<br>画成甜的。</h1><p>一勺热糖，几笔流转。<br>让记忆里的糖画，再亮一次。</p></div>
      <div class="mode-switch" aria-label="创作方式"><button id="watch-mode" aria-pressed="true">看师傅画</button><button id="draw-mode" aria-pressed="false">自由画</button><button id="template-mode" aria-pressed="false">印记模板</button></div>
      <div id="pattern-panel"><h2 id="pattern-heading">挑一幅糖画</h2><div class="patterns" id="patterns"></div></div>
      <div id="template-options" hidden><p class="template-help">沿着淡色印记浇糖，画好后藏起印记。</p><label class="guide-toggle"><input id="template-visible" type="checkbox" checked />显示印记</label><div class="setting-row"><label for="template-opacity">印记深浅</label><output id="template-opacity-value" for="template-opacity">适中</output></div><input id="template-opacity" type="range" min="0.15" max="0.85" step="0.05" value="0.5" /></div>
      <div class="draw-info" id="draw-info" hidden><h2>提起勺，慢慢走</h2><p>按住让糖流下，移动铜勺画出细线。停一停会积糖，松开后余糖继续落完。</p></div>
      <div class="settings">
        <div class="setting-control"><div class="setting-row"><label for="thickness">出糖量</label><output id="thickness-value" for="thickness">适中</output></div><input id="thickness" type="range" min="0.025" max="0.06" step="0.005" value="0.04" /></div>
        <div class="setting-control"><div class="setting-row"><label for="height">提勺高度</label><output id="height-value" for="height">适中</output></div><input id="height" type="range" min="0.65" max="2.3" step="0.05" value="1.55" /></div>
        <div class="setting-row speed-row"><label for="speed">浇糖速度</label><select id="speed"><option value="0.65">慢慢来</option><option value="1" selected>刚刚好</option><option value="1.8">快一点</option></select></div>
      </div>
      <button class="primary-button" id="play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 11 7-11 7Z"/></svg><span>再看一次浇糖</span></button>
      <div class="secondary-actions"><button class="text-button" id="undo" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5-5 5 5 5M3 10h11a6 6 0 0 1 0 12"/></svg>撤回一笔</button><button class="text-button clear-button" id="clear"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7m4-7v7"/></svg>清空石板</button></div>
      <p class="panel-foot">糖会凝固，快乐不会。</p>
    </aside>

    <section class="scene-panel" aria-label="三维糖画工作台">
      <div id="scene" tabindex="0" role="application" aria-label="三维糖画。观看模式下拖动旋转，滚轮缩放；绘画模式下按住石板绘画。键盘方向键旋转，空格暂停。"></div>
      <div class="scene-caption"><span class="scene-title" id="scene-title">蝶恋花</span><span id="scene-description">糖丝绕成翅，甜意便有了形。</span></div>
      <div class="view-tools" aria-label="视角"><button id="angle-view" aria-pressed="true">斜着看</button><button id="top-view" aria-pressed="false">俯着看</button><button id="pour-view" aria-pressed="false">看浇糖</button><button id="detail-view" aria-pressed="false" title="凑近看糖的厚度与透光">细节</button><button class="icon-button" id="focus-view" aria-label="进入专注模式" title="专注模式"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m8 0h5v-5"/></svg></button></div>
      <div class="loading" id="loading" role="status"><span class="loading-seal">糖</span><p>热一勺糖，等一幅画。</p></div>
      <div class="scene-bottom"><p id="hint"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8V6a4 4 0 0 1 8 0v2M6 8h12v8a6 6 0 0 1-12 0Zm6 0v5"/></svg>拖动转一转，滚轮凑近看</p><span class="material-note">铜勺 / 麦芽糖 / 大理石板</span></div>
      <div class="playback" id="playback"><button class="icon-button" id="pause" aria-label="暂停浇糖"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14m8-14v14"/></svg></button><div class="progress-track" role="progressbar" aria-label="浇糖进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress"></span></div><span id="progress-label">正在浇糖</span></div>
    </section>
  </main>
  <footer class="footer"><span>一块石板上的小小欢喜</span><span>慢一点，甜一点。</span></footer>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p class="no-script">请开启 JavaScript，来体验三维糖画。糖画铺是一间用 Three.js 搭起的小小糖画摊。</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
